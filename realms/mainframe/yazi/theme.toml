# Yazi colors for the mainframe realm. Loaded through YAZI_CONFIG_HOME, so each window follows its realm.
[mgr]
cwd = { fg = "#f2f2f2", bold = true }
find_keyword = { fg = "#bdbdbd", bold = true, italic = true }
find_position = { fg = "#d6d6d6", bold = true }
marker_copied = { fg = "#bdbdbd", bg = "#bdbdbd" }
marker_cut = { fg = "#ffffff", bg = "#ffffff" }
marker_marked = { fg = "#d6d6d6", bg = "#d6d6d6" }
marker_selected = { fg = "#f2f2f2", bg = "#f2f2f2" }
count_copied = { fg = "#050505", bg = "#bdbdbd" }
count_cut = { fg = "#050505", bg = "#ffffff" }
count_selected = { fg = "#050505", bg = "#f2f2f2" }
border_symbol = "│"
border_style = { fg = "#333333" }

[indicator]
parent = { fg = "#050505", bg = "#4a4a4a" }
current = { fg = "#050505", bg = "#f2f2f2", bold = true }
preview = { underline = true }

[tabs]
active = { fg = "#050505", bg = "#f2f2f2", bold = true }
inactive = { fg = "#f2f2f2", bg = "#1c1c1c" }

[mode]
normal_main = { fg = "#050505", bg = "#f2f2f2", bold = true }
normal_alt = { fg = "#f2f2f2", bg = "#1c1c1c" }
select_main = { fg = "#050505", bg = "#bdbdbd", bold = true }
select_alt = { fg = "#bdbdbd", bg = "#1c1c1c" }
unset_main = { fg = "#050505", bg = "#ffffff", bold = true }
unset_alt = { fg = "#ffffff", bg = "#1c1c1c" }

[status]
perm_type = { fg = "#f2f2f2" }
perm_read = { fg = "#bdbdbd" }
perm_write = { fg = "#ffffff" }
perm_exec = { fg = "#d6d6d6" }
perm_sep = { fg = "#4a4a4a" }
progress_label = { fg = "#d6d6d6", bold = true }
progress_normal = { fg = "#f2f2f2", bg = "#1c1c1c" }
progress_error = { fg = "#ffffff", bg = "#1c1c1c" }

[input]
border = { fg = "#f2f2f2" }
title = { fg = "#f2f2f2" }
value = { fg = "#d6d6d6" }
selected = { reversed = true }

[confirm]
border = { fg = "#f2f2f2" }
title = { fg = "#f2f2f2", bold = true }
btn_yes = { fg = "#050505", bg = "#f2f2f2", bold = true }
btn_no = { fg = "#d6d6d6" }

[which]
mask = { bg = "#1c1c1c" }
cand = { fg = "#bdbdbd" }
rest = { fg = "#4a4a4a" }
desc = { fg = "#f2f2f2" }
separator_style = { fg = "#4a4a4a" }

[tasks]
border = { fg = "#f2f2f2" }
title = { fg = "#f2f2f2" }
hovered = { fg = "#050505", bg = "#f2f2f2" }

[help]
border = { fg = "#f2f2f2" }
chord = { fg = "#bdbdbd" }
action = { fg = "#d6d6d6" }
hovered = { fg = "#050505", bg = "#f2f2f2" }

[filetype]
rules = [
  { url = "*/", fg = "#f2f2f2", bold = true },
  { mime = "image/*", fg = "#bdbdbd" },
  { mime = "{audio,video}/*", fg = "#d6d6d6" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive}", fg = "#ffffff" },
  { url = "*", is = "exec", fg = "#ffffff", bold = true },
  { url = "*", is = "link", fg = "#d6d6d6", italic = true },
  { url = "*", fg = "#d6d6d6" },
]
